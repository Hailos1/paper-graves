# Главный переключатель (также меняется командой /graves toggle)
enabled: true

# Сколько секунд могила существует до исчезновения
lifetime-seconds: 3600

# Крыша Незера начинается с Y >= 127. Могилы появляются на крыше только если игрок умер там.
nether-roof-y: 127

messages:
  prefix: "<dark_gray>[<gold>Могилы</gold>]</dark_gray> "
  grave-created: "<gray>Ваша могила создана на координатах <white>{x}, {y}, {z}</white> в мире <white>{world}</white>. Исчезнет через <white>{time}</white>.</gray>"
  grave-collected: "<gray>Вы забрали вещи из своей могилы.</gray>"
  grave-expired: "<gray>Ваша могила на координатах <white>{x}, {y}, {z}</white> исчезла.</gray>"
  not-owner: "<red>Эта могила принадлежит другому игроку.</red>"
  graves-disabled: "<red>Могилы после смерти сейчас отключены.</red>"
  no-graves: "<gray>У вас нет активных могил.</gray>"
  toggled-on: "<green>Могилы после смерти включены.</green>"
  toggled-off: "<red>Могилы после смерти отключены.</red>"
  no-permission: "<red>У вас нет прав на эту команду.</red>"
  only-players: "<red>Эта команда доступна только игрокам.</red>"
  list-heading: "<gray>Активные могилы: <white>{count}</white></gray>"
  list-entry: "<white>{world}</white> <gray>{x}, {y}, {z} - осталось <white>{time}</white></gray>"
  help-1: "<gold>/graves help</gold> <gray>- показать помощь</gray>"
  help-2: "<gold>/graves list</gold> <gray>- список ваших активных могил</gray>"
  help-3: "<gold>/graves toggle</gold> <gray>- включить или отключить могилы</gray>"

name: PaperGraves

version: '${version}'

main: com.graves.GravesPlugin

api-version: '1.21'

description: Могилы с вещами игрока после смерти

authors: [PaperGraves]

commands:
  graves:
    description: Управление могилами после смерти
    usage: /graves <help|list|toggle>
    aliases: [grave]

permissions:
  graves.list:
    description: Список ваших активных могил
    default: true
  graves.admin:
    description: Включение и отключение могил
    default: op
  graves.*:
    description: Все права PaperGraves
    default: op
    children:
      graves.list: true
      graves.admin: true
